<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Hunt Command</title>
<style>
:root{
 --font-sans: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
 --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
 --fs-11:11px;--lh-11:16px; --fs-12:12px;--lh-12:16px; --fs-13:13px;--lh-13:18px;
 --row:32px;
 --r-4:4px;--r-8:8px;--r-10:10px;--r-pill:999px;
 --rail:236px;--details:320px;
 --dur:150ms;--ease-sharp:cubic-bezier(.165,.84,.44,1);
 --hair:.5px;
}
.t-dark{
 --bg-rail:#0e0e0e;--bg-chrome:#121212;--bg-pane:#161616;--bg-raised:#1c1c1c;--bg-sunk:#0a0a0a;
 --ink:255,255,255;
 --c-blocked:#f0565b;--c-working:#e5a83b;--c-done:#3fc1a5;--c-idle:rgba(255,255,255,.40);--accent:#5d9bff;
 --shadow-1:none;--shadow-2:none;--shadow-3:none;--scrim:rgba(0,0,0,.5);
 color-scheme:dark;
}
.t-dark{
 --ink-1:rgba(var(--ink),1);--ink-2:rgba(var(--ink),.68);--ink-3:rgba(var(--ink),.56);--ink-4:rgba(var(--ink),.40);
 --line-1:rgba(var(--ink),.24);--line-2:rgba(var(--ink),.12);--line-3:rgba(var(--ink),.08);
 --fill-1:rgba(var(--ink),.06);--fill-2:rgba(var(--ink),.04);
 --t17-blocked:color-mix(in srgb,var(--c-blocked) 17%,transparent);
 font-family:var(--font-sans);font-size:var(--fs-13);line-height:var(--lh-13);color:var(--ink-1);
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-pane)}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;text-align:inherit;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
/* ---------- primitives (canvas) ---------- */
.i{flex:none;display:block;width:16px;height:16px}
.g{flex:none;display:block;width:12px;height:12px}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
.wv .st,.pane-h .st{min-width:0}
.wv .st > span{overflow:hidden;text-overflow:ellipsis}
.st-dropped > span{text-decoration:line-through;text-decoration-color:var(--ink-4)}
.g-blocked{color:var(--c-blocked)}.g-working{color:var(--c-working)}.g-done{color:var(--c-done)}.g-idle{color:var(--c-idle)}.g-dropped{color:var(--ink-4)}
.mg{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:var(--r-4);background:var(--fill-1);box-shadow:inset 0 0 0 var(--hair) var(--line-2);font-size:10px;line-height:1;font-weight:600;color:var(--ink-2);letter-spacing:.02em;flex:none}
.mg.lg{width:28px;height:28px;font-size:11px;border-radius:6px}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:0}
.mut{color:var(--ink-3)} .faint{color:var(--ink-4)} .sec{color:var(--ink-2)}
.sm{font-size:var(--fs-12);line-height:var(--lh-12)}
.xs{font-size:var(--fs-11);line-height:var(--lh-11)}
.b5{font-weight:500}.b6{font-weight:600}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2,.clamp3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clamp2{-webkit-line-clamp:2}.clamp3{-webkit-line-clamp:3}
.full{white-space:pre-wrap;overflow-wrap:anywhere}
.clipw{min-width:0}
.more{display:inline-block;margin-top:2px;font-size:12px;line-height:16px;color:var(--ink-3)}
.more:hover{color:var(--ink-2)}
.ids{display:flex;flex-wrap:wrap;gap:2px 12px;line-height:18px}
.ids > span{white-space:nowrap}
.hnote{margin:0 0 8px;font-size:12px;line-height:16px;color:var(--ink-2);overflow-wrap:anywhere}
.wrap{overflow-wrap:anywhere}
.bw{overflow-wrap:break-word}
.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:var(--r-pill);background:var(--t17-blocked);color:var(--c-blocked);font-size:12px;font-weight:500;white-space:nowrap;justify-self:start}
.kbd{font-family:var(--font-mono);font-size:11px;line-height:16px;padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 var(--hair) var(--line-1);color:var(--ink-2);white-space:nowrap}
.link{display:inline-flex;align-items:center;gap:4px;color:var(--ink-1);font-weight:500;text-decoration:none}
.link .i{color:var(--ink-3)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink-1);margin:0 0 8px}
.sec-h .aside{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.box{background:var(--bg-raised);border-radius:var(--r-10);box-shadow:inset 0 0 0 var(--hair) var(--line-2),var(--shadow-1)}
.list > .li{display:flex;align-items:center;gap:12px;min-height:var(--row);padding:6px 12px;border-top:var(--hair) solid var(--line-3);width:100%}
.list > .li:first-child{border-top:0}
.list > .li.on{background:var(--fill-2)}
.facts{display:grid;grid-template-columns:112px 1fr;row-gap:6px;column-gap:12px;font-size:12px;line-height:16px;margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;color:var(--ink-1);min-width:0;overflow-wrap:anywhere}
.th{font-size:12px;color:var(--ink-3);font-weight:500}
ol.dec{margin:0;padding-left:16px;font-size:12px;line-height:16px;color:var(--ink-2)}
ol.dec li{margin-bottom:6px}
ol.dec.loose li{margin-bottom:8px}
.ri:not(.on) .g,.li:not(.on) .st .g,.li:not(.on) > .g{opacity:.5}
/* ---------- board shell ---------- */
#app{display:grid;grid-template-rows:44px minmax(0,1fr) 28px;height:100vh;background:var(--bg-pane)}
.bd-top{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg-chrome);border-bottom:var(--hair) solid var(--line-2);min-width:0}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;width:204px;flex:none}
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px;white-space:nowrap;min-width:0;overflow:hidden}
.crumb .mono{color:var(--ink-1);overflow:hidden;text-overflow:ellipsis;max-width:240px}
.tabs{display:flex;gap:4px;margin-left:8px;flex:none}
.tab{height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--r-8);color:var(--ink-3);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink-1);background:var(--fill-1)}
.health{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12px;color:var(--ink-3);white-space:nowrap;min-width:0;overflow:hidden}
.health > *{flex:none}
.health .counts{gap:12px;color:var(--ink-1);min-width:auto}
.health .counts .st{color:var(--ink-1)}
.vsep{width:.5px;height:16px;background:var(--line-1);flex:none}
.bd-body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--details);min-height:0}
#app[data-v="agents"] .bd-body{grid-template-columns:var(--rail) minmax(0,1fr)}
#app[data-v="evidence"] .bd-body{grid-template-columns:minmax(0,1fr) var(--details)}
#app[data-v="agents"] #details,#app[data-v="evidence"] #rail{display:none}
.bd-foot{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg-chrome);border-top:var(--hair) solid var(--line-2);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.bd-foot .k{display:inline-flex;gap:6px;align-items:center}
.bd-foot .end{margin-left:auto}
.rail{background:var(--bg-rail);border-right:var(--hair) solid var(--line-2);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rail-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.rail-h{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 16px;font-size:12px;font-weight:500;color:var(--ink-3);flex:none}
.rail-h .i{color:var(--ink-4)}
.rail-h .ib{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:-4px;border-radius:var(--r-4)}
.rail-h .ib:hover .i{color:var(--ink-2)}
.ri{display:flex;align-items:center;gap:10px;margin:0 8px;padding:6px 8px;border-radius:var(--r-8);min-height:var(--row);width:calc(100% - 16px)}
.ri.sm8{padding:4px 8px}
.ri:hover{background:var(--fill-2)}
.ri.on{background:var(--fill-1)}
.ri .t{font-size:13px;line-height:18px;color:var(--ink-1)}
.ri .t .r{font-size:12px;color:var(--ink-3)}
.ri .s{font-size:12px;line-height:16px;color:var(--ink-3)}
.sep{height:var(--hair);background:var(--line-2);margin:8px 16px;flex:none}
.main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.main > .pad-end{flex:none;height:24px}
.details{background:var(--bg-chrome);border-left:var(--hair) solid var(--line-2);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;min-height:0}
.dpad{padding:16px 20px}
.dsec{padding:16px 20px;border-top:var(--hair) solid var(--line-2)}
.sect{padding:20px 32px 0;flex:none}
.h1{margin:0;font-size:17px;line-height:24px;font-weight:600}
.note-bad{color:var(--c-blocked)}
.empty{padding:14px 16px;font-size:13px;color:var(--ink-3)}
/* case */
.wv{display:grid;grid-template-columns:16px 64px minmax(0,1fr) 92px 72px 56px;gap:12px;align-items:center;width:100%}
.wv.sub{grid-template-columns:20px 120px minmax(0,1fr) 92px 72px 56px}
.wv-wide .wv{grid-template-columns:16px 64px minmax(0,1fr) 148px 72px 56px}
.wv-wide .wv.sub{grid-template-columns:20px 120px minmax(0,1fr) 148px 72px 56px}
.dropcell{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pane.line{flex-direction:row}
.pane.line .pane-h{flex:1;border-bottom:0}
.li.subrow{padding-left:40px}
.li.btn{cursor:pointer}
.li.btn:hover:not(.on){background:var(--fill-2)}
.num{text-align:right}
.cl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:12px 0;border-top:var(--hair) solid var(--line-3)}
.cl:first-child{border-top:0}
.clbox .cl.on{background:var(--fill-2);margin:0 -16px;padding-left:16px;padding-right:16px}
.kind{font-size:12px;color:var(--ink-2)}
.stmt{font-size:14px;line-height:20px}
.gate-card{padding:16px;box-shadow:inset 0 0 0 var(--hair) var(--line-1)}
.gate-card + .gate-card{margin-top:12px}
.gate-card ol{margin:0 0 10px;padding-left:18px;font-size:13px;line-height:18px;color:var(--ink-1)}
.gate-card ol li{margin-bottom:4px}
.screen{background:var(--bg-sunk);border-radius:var(--r-8);box-shadow:inset 0 0 0 var(--hair) var(--line-2);overflow:hidden;position:relative}
.screen.small{height:96px}
.screen img{display:block;width:100%;height:auto}
.screen .scr-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);font-size:12px;padding:0 12px;text-align:center}
.screen.small.has-img{height:auto;aspect-ratio:16/10}
.screen.small img{height:100%;object-fit:contain;object-position:top center}
.namebtn{border-radius:var(--r-4)}
.namebtn:hover{text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px}
/* panes */
.panes{display:grid;gap:1px;background:var(--line-2);flex:1;min-height:0}
.pane{background:var(--bg-pane);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.pane-h{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:var(--hair) solid var(--line-2);font-size:12px;color:var(--ink-3);flex:none;white-space:nowrap;min-width:0}
.pane-h .t{color:var(--ink-1);font-weight:500;font-size:13px}
.pane-h .tail{margin-left:auto;padding-left:8px}
.pane-h > span{overflow:hidden;text-overflow:ellipsis}
.pane-h .i{color:var(--ink-2)}
.pane.focus::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--accent);pointer-events:none;z-index:2}
.pane-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.tl{display:grid;grid-template-columns:28px 64px 132px minmax(0,1fr) 56px;gap:12px;align-items:baseline;padding:6px 12px;border-top:var(--hair) solid var(--line-3);font-size:12px;line-height:16px}
.tl.head{border:0}
.tl .err{color:var(--c-blocked)}
.tl .qlink{text-decoration:underline;text-decoration-color:var(--line-1);text-underline-offset:3px}
.tl .qlink:hover{color:var(--ink-1)}
.live-meta{display:flex;align-items:center;gap:6px;padding:0 12px 12px;flex:none;min-width:0}
.live-meta .tail{margin-left:auto;white-space:nowrap}
/* evidence */
.tlx{display:grid;grid-template-columns:140px minmax(0,1fr) 128px;align-items:center}
.tlx .track{position:relative;height:32px;background:linear-gradient(var(--line-3),var(--line-3)) 0 50%/100% .5px no-repeat}
.tlx .ticks{position:relative;height:24px}
.tlx .ticks span{position:absolute;top:0;transform:translateX(-50%)}
.dot{position:absolute;top:13px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink-2);padding:0}
.dot.on{width:10px;height:10px;margin-left:-5px;top:11px;background:var(--accent)}
.list > .li.evr{display:grid;grid-template-columns:104px 96px 96px 72px minmax(0,1fr) 180px;gap:12px}
/* toasts */
#toasts{position:fixed;right:16px;bottom:40px;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
#app[data-v="case"] ~ #toasts,#app[data-v="agent"] ~ #toasts,#app[data-v="evidence"] ~ #toasts{right:336px}
.toast{width:248px;background:var(--bg-raised);border-radius:var(--r-10);box-shadow:inset 0 0 0 var(--hair) var(--line-1),var(--shadow-2);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;pointer-events:auto;cursor:pointer;text-align:left}
.toast .g{margin-top:3px}
@media (prefers-reduced-motion: no-preference){
 .toast.enter{animation:toast-in var(--dur) var(--ease-sharp)}
 @keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.sheet{width:min(560px,calc(100vw - 32px));max-height:70vh;display:flex;flex-direction:column;background:var(--bg-raised);border-radius:var(--r-10);box-shadow:inset 0 0 0 var(--hair) var(--line-1),var(--shadow-3);overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-bottom:var(--hair) solid var(--line-2);flex:none}
.sheet-h input{flex:1;min-width:0;height:28px;background:transparent;border:0;color:var(--ink-1);font:14px/20px var(--font-sans)}
.sheet-h input::placeholder{color:var(--ink-4)}
.sheet-h .i{color:var(--ink-3)}
.sheet-b{overflow-y:auto;padding:6px 0}
.sheet-grp{padding:8px 16px 4px;font-size:12px;font-weight:500;color:var(--ink-3)}
.pr{display:flex;align-items:center;gap:10px;min-height:var(--row);padding:6px 16px;width:100%}
.pr.on{background:var(--fill-1)}
.pr.ind{padding-left:40px}
.pr .meta{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;padding:8px 16px 16px}
.keys h3{grid-column:1/-1;margin:12px 0 4px;font-size:12px;font-weight:500;color:var(--ink-3)}
.keys .kr{display:flex;align-items:center;gap:10px;min-height:24px;font-size:12px;color:var(--ink-2)}
.keys .kr .kbd{min-width:44px;text-align:center}
/* phone */
.ph-head,.ph-tabs{display:none}
#app.ph{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#app.ph .bd-top,#app.ph .bd-foot{display:none}
#app.ph .ph-head{display:block;padding:8px 16px 12px;border-bottom:var(--hair) solid var(--line-2);background:var(--bg-pane);min-width:0}
#app.ph .ph-head .row.sm{flex-wrap:wrap;row-gap:4px}
#app.ph .ph-tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px max(28px, env(safe-area-inset-bottom));border-top:var(--hair) solid var(--line-2);background:var(--bg-chrome)}
.ph-tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:16px;color:var(--ink-3)}
.ph-tabs button.on{color:var(--ink-1)}
#app.ph .bd-body{display:block;overflow-y:auto;overflow-x:hidden}
#app.ph .rail,#app.ph .details,#app.ph .main{display:none;overflow:visible;border:0}
#app.ph[data-v="agents"] .rail{display:flex;background:var(--bg-pane)}
#app.ph[data-v="agents"] .rail-scroll{overflow:visible}
#app.ph[data-v="case"] .main,#app.ph[data-v="evidence"] .main,#app.ph[data-v="agent"] .main,#app.ph[data-v="inbox"] .main{display:flex}
#app.ph[data-v="evidence"] .details,#app.ph[data-v="agent"] .details{display:flex;border-top:var(--hair) solid var(--line-2)}
#app.ph .sect{padding:16px 16px 0}
#app.ph .wv{grid-template-columns:16px 56px minmax(0,1fr) 48px}
#app.ph .wv > :nth-child(4),#app.ph .wv > :nth-child(5){display:none}
#app.ph .wv.sub{grid-template-columns:20px minmax(0,1fr) auto 48px}
#app.ph .wv.sub > :nth-child(4){display:none}
#app.ph .wv.sub > :nth-child(5){display:none}
#app.ph .cl{grid-template-columns:minmax(0,1fr);gap:4px}
#app.ph .evr{grid-template-columns:96px minmax(0,1fr)}
#app.ph .evr > :nth-child(2),#app.ph .evr > :nth-child(3),#app.ph .evr > :nth-child(4),#app.ph .evr > :nth-child(6){display:none}
#app.ph .tlx{grid-template-columns:96px minmax(0,1fr) 0}
#app.ph .tlx > :nth-child(3){display:none}
#app.ph .ag-head{flex-wrap:wrap}
#app.ph ~ #toasts{right:12px;left:12px;bottom:84px;align-items:stretch}
#app.ph ~ #toasts .toast{width:auto}
/* narrow desktop */
@media (max-width:1100px){
 #app:not(.ph)[data-v="case"] .bd-body{grid-template-columns:minmax(0,1fr) 280px}
 #app:not(.ph)[data-v="case"] #rail{display:none}
 #app:not(.ph)[data-v="agent"] .bd-body{grid-template-columns:200px minmax(0,1fr) 280px}
 #app:not(.ph)[data-v="evidence"] .bd-body{grid-template-columns:minmax(0,1fr) 280px}
 #app:not(.ph)[data-v="case"] ~ #toasts,#app:not(.ph)[data-v="agent"] ~ #toasts,#app:not(.ph)[data-v="evidence"] ~ #toasts{right:296px}
 .mark{width:auto}
}
@media (max-width:960px){
 .mark .mt,#crumb-round{display:none}
}
</style>
</head>

<script>
"use strict";
(function(){
const STATE_URL = new URL("/state.json", location.href).href;
const SVGNS = "http://www.w3.org/2000/svg";
const LIVE_FRESH_MS = 10000, POLL_MS = 2000, TOAST_MS = 6000;
const GATE = new Set(["awaiting_approval", "awaiting_review"]);
const OPEN = new Set(["working", "awaiting_approval", "awaiting_review"]);
const KINDS = ["blocked", "working", "done", "idle", "dropped"];
const VIEWS = ["case", "agents", "evidence", "agent", "inbox"];
const $ = (id) => document.getElementById(id);

let state = null, idx = null, lastKey = null, fetchError = null, prevStates = null;
const route = {view:"case", agent:null};
const ui = {caseKey:null, expanded:new Set(), collapsed:new Set(), agentSel:null, paneFocus:0, zoom:false, filter:null,
  claimSel:-1, evSel:null, evHost:null, evCat:null, footMsg:"", explicitView:false, showAll:new Set(), openText:new Set()};

// ---------- DOM helpers ----------
function h(tag, cls, text, attrs){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  for (const k in attrs || {}) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, String(attrs[k]));
  return n;
}
function add(p){ for (let i = 1; i < arguments.length; i++){ const c = arguments[i]; if (c !== null && c !== undefined && c !== false) p.appendChild(typeof c === "string" ? document.createTextNode(c) : c); } return p; }

function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function icon(id){
  const s = sv("svg", {class:"i", width:16, height:16, viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", "stroke-width":"1.5",
    "stroke-linecap":"round", "stroke-linejoin":"round", "aria-hidden":"true"});
  s.appendChild(sv("use", {href:"#i-" + id}));
  return s;
}
function glyph(k){
  const s = sv("svg", {class:"g g-" + k, width:12, height:12, viewBox:"0 0 12 12", "aria-hidden":"true"});
  const line = {fill:"none", stroke:"currentColor", "stroke-width":"1.5", "stroke-linecap":"round"};
  if (k === "blocked") s.appendChild(sv("circle", {cx:6, cy:6, r:4, fill:"currentColor"}));
  else if (k === "working") s.appendChild(sv("path", Object.assign({d:"M6 1.75a4.25 4.25 0 1 1-4.25 4.25"}, line)));
  else if (k === "done") s.appendChild(sv("path", Object.assign({d:"M2.25 6.25 4.75 8.75 9.75 3.5", "stroke-linejoin":"round"}, line)));
  else if (k === "dropped") s.appendChild(sv("path", Object.assign({d:"M2.5 6h7"}, line)));
  else s.appendChild(sv("circle", {cx:6, cy:6, r:3.25, fill:"none", stroke:"currentColor", "stroke-width":"1.5"}));
  return s;
}
function stEl(k, text, plain){ return add(h("span", plain ? "st" : "st st-" + k), glyph(k), h("span", null, text)); }
function kbd(keys, label){ return add(h("span", "k"), h("span", "kbd", keys), label); }

// ---------- formatting ----------
function pad2(n){ return String(n).padStart(2, "0"); }
function fmtDur(ms){
  if (ms === null || ms === undefined || !isFinite(ms) || ms < 0) return "\u2014";
  const s = Math.floor(ms / 1000), hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return hh ? hh + ":" + pad2(m) + ":" + pad2(s % 60) : m + ":" + pad2(s % 60);
}
function hms(ms){ return ms === null || ms === undefined ? "\u2014" : new Date(ms).toISOString().slice(11, 19); }
function num(n){ return typeof n === "number" ? n.toLocaleString("en-US") : "\u2014"; }
function tokShort(n){ if (typeof n !== "number") return "\u2014"; return n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(1) + "k" : n < 1e9 ? (n / 1e6).toFixed(2) + "M" : (n / 1e9).toFixed(2) + "B"; }
function plural(n, word){ return num(n) + " " + word + (n === 1 ? "" : "s"); }
function isoMs(t){ const v = typeof t === "string" ? Date.parse(t) : NaN; return isNaN(v) ? null : v; }
function words(s){ return String(s || "").replace(/_/g, " "); }
function windowText(c){
  const a = isoMs(c && c.start), b = isoMs(c && c.end);
  if (a === null || b === null) return null;
  const da = new Date(a).toISOString(), db = new Date(b).toISOString();
  return da.slice(0, 10) === db.slice(0, 10) ? da.slice(0, 10) + " " + da.slice(11, 16) + "\u2013" + db.slice(11, 16) + " UTC"
    : da.slice(0, 10) + " " + da.slice(11, 16) + " \u2013 " + db.slice(0, 10) + " " + db.slice(11, 16) + " UTC";
}
function since(el, startMs, baseMs){ el.dataset.since = startMs; el.dataset.base = baseMs || 0; el.textContent = fmtDur(Date.now() - startMs + (baseMs || 0)); return el; }

// ---------- step model ----------
function kindOf(s){
  if (GATE.has(s.state)) return "blocked";
  if (s.state === "working") return "working";
  if (s.state === "done") return "done";
  if (s.state === "dropped" || s.state === "stopped") return "dropped";
  return "idle";
}
function stateWords(s){
  const k = kindOf(s);
  const retried = (s.handoff_rejections || []).some((r) => r.outcome === "retried");
  if (k === "blocked") return "blocked \u00b7 " + words(s.state);
  if (k === "idle") return "idle \u00b7 " + (s.state === "not_reached" ? "not reached" : "pending");
  if (k === "dropped") return s.state;
  return k + (retried ? " \u00b7 retried" : "");
}
// Why a step ended without its handoff: the workflow's reason, then the run's diagnostic (exit code and redacted cause).
function cause(s){ return [words(s.reason), s.result && s.result.diagnostic].filter(Boolean).join(": "); }
function stepSince(s){
  const t = s.timing || {};
  if (!OPEN.has(s.state)) return null;
  if (t.started_ms !== null && t.started_ms !== undefined) return t.started_ms;
  const w = idx.waveSpan.get(s.wave);
  return w && w.open_since_ms !== null && w.open_since_ms !== undefined ? w.open_since_ms : null;
}
function timeEl(s, cls){
  const e = h("span", cls || null), at = stepSince(s), t = s.timing || {};
  if (at !== null) return since(e, at);
  e.textContent = s.state === "pending" || s.state === "not_reached" ? "\u2014" : fmtDur(t.duration_ms);
  return e;
}
function rollKind(steps){
  if (!steps.length) return "idle";
  if (steps.some((s) => GATE.has(s.state))) return "blocked";
  if (steps.some((s) => s.state === "working")) return "working";
  if (steps.every((s) => s.state === "done" || s.state === "dropped" || s.state === "stopped")) return steps.some((s) => s.state === "done") ? "done" : "dropped";
  return "idle";
}
function counts(steps){ const c = {blocked:0, working:0, done:0, idle:0, dropped:0}; for (const s of steps) c[kindOf(s)]++; return c; }
function roleOf(s){ return s.role || s.profile || ""; }
function fromLab(){ return state.mode === "tool_driven"; }

function buildIndex(){
  const steps = state.steps || [];
  const byId = new Map(steps.map((s) => [s.step_id, s]));
  const feedBy = new Map((state.feed || []).map((f) => [f.step_id, f]));
  const claims = [];
  let verdicts = 0;
  for (const f of state.feed || []){
    for (const c of ((f.handoff || {}).claims) || []){ claims.push({c:c, s:byId.get(f.step_id)}); verdicts += (c.verdicts || []).length; }
  }
  claims.sort((a, b) => (a.s ? a.s.index : 1e9) - (b.s ? b.s.index : 1e9));
  const waves = new Map();
  for (const s of steps){ if (!waves.has(s.wave)) waves.set(s.wave, []); waves.get(s.wave).push(s); }
  const waveList = Array.from(waves.keys()).sort((a, b) => a - b).map((w) => ({wave:w, steps:waves.get(w)}));
  const events = ((state.timeline || {}).events) || [];
  return {byId:byId, feedBy:feedBy, claims:claims, verdicts:verdicts, waveList:waveList,
    waveSpan:new Map((state.waves || []).map((w) => [w.wave, w])),
    lanes:new Map((((state.tools || {}).lanes) || []).map((l) => [l.profile, l])),
    events:events, evById:new Map(events.map((e) => [e.id, e])), team:state.team || []};
}
// The claims that cite an event: claims of the counted steps the board lists in event.cited_by.
function citingClaims(e){
  const steps = new Set(e.cited_by || []);
  return idx.claims.filter((x) => x.s && steps.has(x.s.step_id) && (x.c.cited_events || []).includes(e.id));
}
function handoff(s){ const f = idx.feedBy.get(s.step_id); return f ? f.handoff : null; }
function waveOf(n){ return idx.waveList.find((w) => w.wave === n) || null; }
function nextWave(n){ return idx.waveList.find((w) => w.wave > n) || null; }
function waveNames(steps){
  const m = steps.map((s) => /^(.*?)[- ](\d+)$/.exec(s.name || ""));
  if (steps.length > 2 && m.every((x) => x && x[1] === m[0][1])) return steps[0].name + " \u2013 " + steps[steps.length - 1].name;
  return steps.map((s) => s.name).join(", ");
}
function waveRep(w){
  return w.steps.find((s) => GATE.has(s.state)) || w.steps.find((s) => s.state === "working")
    || w.steps.slice().reverse().find((s) => s.state === "done") || w.steps[0];
}
function waveWall(w){ return idx.waveSpan.get(w.wave) || {closed_ms:0, open_since_ms:null}; }
function waveTimeEl(w){
  const span = waveWall(w), e = h("span", "sm sec num");
  if (w.steps.some((s) => GATE.has(s.state))){ e.textContent = "open"; return e; }
  if (span.open_since_ms !== null && span.open_since_ms !== undefined) return since(e, span.open_since_ms, span.closed_ms || 0);
  e.textContent = w.steps.every((s) => s.state === "pending" || s.state === "not_reached") ? "\u2014" : fmtDur(span.closed_ms || 0);
  return e;
}
function claimCount(steps){ let n = 0, any = false; for (const s of steps) if (typeof s.claims === "number"){ n += s.claims; any = true; } return any ? n : null; }
function stepCalls(s){
  const lane = idx.lanes.get(s.profile);
  if (!lane) return {calls:[], lane:null, shared:[]};
  const t = s.timing || {}, now = Date.now();
  if (t.started_ms === null || t.started_ms === undefined) return {calls:[], lane:lane, shared:[]};
  const end = OPEN.has(s.state) || t.ended_ms === null || t.ended_ms === undefined ? now : t.ended_ms;
  const calls = lane.entries.filter((e) => { const m = isoMs(e.time); return m !== null && m >= t.started_ms - 1000 && m <= end + 1000; });
  calls.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  // Tool calls are logged per profile, so a step sharing its profile with an overlapping step may see that step's calls.
  const shared = (state.steps || []).filter((o) => {
    const ot = o.timing || {};
    if (o === s || o.profile !== s.profile || ot.started_ms === null || ot.started_ms === undefined) return false;
    const oend = OPEN.has(o.state) || ot.ended_ms === null || ot.ended_ms === undefined ? now : ot.ended_ms;
    return ot.started_ms < end && oend > t.started_ms;
  });
  // The board keeps only the newest entries per profile while lane.count counts every call; say when this step predates them.
  const kept = lane.entries.map((e) => isoMs(e.time)).filter((m) => m !== null), oldest = kept.length ? Math.min(...kept) : null;
  const cut = lane.count > lane.entries.length && (oldest === null || t.started_ms < oldest) ? {before:oldest, shown:lane.entries.length, total:lane.count} : null;
  return {calls:calls, lane:lane, shared:shared, cut:cut};
}
function cutText(sc){
  const c = sc.cut;
  return c ? (c.before !== null ? "Calls before " + hms(c.before) : "Older calls") + " are not kept on the board (" + num(c.shown) + " of " + num(c.total) + " shown)." : null;
}
function noCallsText(s, sc){
  const lab = (state.tools || {}).lab || {};
  if (!fromLab()) return "Inline input: this hunt used no lab tools.";
  if (!sc.lane) return "No tool lane for this profile.";
  if (sc.cut) return cutText(sc);
  if (sc.lane.count) return "No calls by " + s.profile + " in this step's time window.";
  if (lab.error) return "None on record for this profile. The lab was unreachable when the board last looked.";
  return "None on record for this profile.";
}
// ---------- live screens (one persistent <img> per profile) ----------
const screens = new Map();
function screenFor(profile){
  if (screens.has(profile)) return screens.get(profile);
  const box = h("div", "screen"), empty = h("div", "scr-empty");
  box.appendChild(empty);
  const c = {profile:profile, box:box, empty:empty, img:null};
  screens.set(profile, c);
  return c;
}
function liveOwner(profile){ return ((((state.live || {}).owners) || []).find((o) => o.profile === profile)) || null; }
function browserOf(profile){ return (state.browsers || []).find((b) => b.profile === profile) || null; }
function liveStatus(profile, now){
  const o = liveOwner(profile);
  const team = idx.team.find((m) => m.profile === profile);
  const running = !!team && (team.open_steps || []).some((x) => x.state === "working");
  const fresh = !!o && o.last_frame_at !== null && o.last_frame_at !== undefined && now - o.last_frame_at < LIVE_FRESH_MS;
  if (o && o.attached && running && fresh) return {k:"working", text:"Live \u00b7 " + plural(o.frames, "frame")};
  if (o && o.last_frame_at !== null && o.last_frame_at !== undefined){
    const s = Math.max(0, Math.round((now - o.last_frame_at) / 1000));
    return {k:"idle", text:"Idle \u00b7 last frame " + (s < 90 ? s + " s" : s < 5400 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h") + " ago"};
  }
  if (o) return {k:"idle", text:o.attached ? "Attached \u00b7 no frame yet" : "Waiting for browser"};
  return {k:"idle", text:"No screencast"};
}
function liveProfile(prefer){
  if (prefer && (liveOwner(prefer) || browserOf(prefer))) return prefer;
  const o = (((state.live || {}).owners) || []).find((x) => x.frames > 0);
  if (o) return o.profile;
  const b = (state.browsers || []).find((x) => x.action);
  return b ? b.profile : prefer;
}
function updateScreen(c){
  const o = liveOwner(c.profile), frames = o ? o.frames : 0;
  if (frames > 0 && !c.img){
    const src = new URL("/live/" + encodeURIComponent(c.profile) + ".mjpg", location.href).href;
    const img = h("img", null, null, {alt:"", src:src});
    // The stream ends when the board restarts or the stream cap is reached; reconnect after a pause.
    img.addEventListener("error", () => setTimeout(() => img.setAttribute("src", src), 5000));
    c.box.insertBefore(img, c.empty);
    c.img = img;
  }
  if (c.img) c.img.setAttribute("alt", (o ? o.role : c.profile) + " lab browser, view only");
  c.box.classList.toggle("has-img", !!c.img);
  c.empty.hidden = !!c.img;
  clear(c.empty);
  add(c.empty, icon("monitor"), !o ? "No live screen for this profile" : o.attached ? "Attached \u00b7 waiting for the first frame" : "Waiting for the lab browser");
}
function placeScreen(slot, profile, small){
  const c = screenFor(profile);
  c.box.classList.toggle("small", !!small);
  updateScreen(c);
  if (c.box.parentNode !== slot) slot.appendChild(c.box);
  return c;
}
function liveNote(profile){
  if (!state.live) return "Appears when an agent uses lab_browser and the board runs with --hermes-home.";
  if (!liveOwner(profile)) return "Only the lab-browser profiles stream to the board.";
  return null;
}
function refreshLiveText(){
  const now = Date.now();
  document.querySelectorAll("[data-live]").forEach((el) => {
    const st = liveStatus(el.dataset.live, now), want = st.k + "|" + st.text;
    if (el.dataset.key === want) return;
    el.dataset.key = want; clear(el); add(el, stEl(st.k, st.text, true));
  });
  for (const c of screens.values()) if (c.box.isConnected) updateScreen(c);
}

// ---------- shell ----------
function renderMark(){ const m = $("mark"); if (!m.firstChild) add(m, icon("radar"), h("span", "mt", "Hunt Command")); }
function renderTop(){
  const p = (state.run || {}).parent;
  $("crumb-case").textContent = state.case && state.case.case_id ? state.case.case_id : "case id not supplied";
  $("crumb-case").title = $("crumb-case").textContent;
  $("crumb-round").textContent = p ? "round " + (p.round_index || 0) + " of " + (p.rounds || "?") : "round not observed";
  renderHealth();
}
function countsEl(cls){
  const c = counts(state.steps || []), row = h("span", "row " + (cls || "counts"));
  for (const k of KINDS) if (c[k]){ const x = stEl(k, c[k] + " " + k); x.dataset.k = k; row.appendChild(x); }
  if (!(state.steps || []).length) row.appendChild(h("span", "mut", "no steps"));
  row.title = KINDS.filter((k) => c[k]).map((k) => c[k] + " " + k).join(" \u00b7 ");
  return row;
}
function renderHealth(){
  const el = $("health"); clear(el);
  const t = state.temporal || {}, lab = ((state.tools || {}).lab) || {};
  const cs = countsEl();
  add(el, cs, h("span", "vsep"));
  if (fetchError){ const x = stEl("blocked", "Board unreachable", true); x.title = fetchError; el.appendChild(x); }
  // Temporal can answer while the status query itself fails (for example with no worker); say so instead of "reachable".
  if (t.reachable && !t.error) el.appendChild(stEl("done", "Temporal reachable", true));
  else { const x = stEl("blocked", t.reachable ? "Temporal query failed" : "Temporal unreachable", true); x.title = (t.error || "") + (t.last_success_at ? " \u00b7 last answer " + t.last_success_at : " \u00b7 no answer yet"); el.appendChild(x); }
  if (fromLab()){
    const x = lab.reachable ? stEl("done", "Lab reachable", true) : stEl("idle", "Lab unreachable", true);
    if (lab.error) x.title = lab.error;
    el.appendChild(x);
  } else el.appendChild(stEl("idle", "Inline input", true));
  const at = isoMs(t.observed_at);
  if (at !== null){
    const d = new Date(at);
    el.appendChild(h("span", "mono faint", "observed " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()), {title:t.observed_at, "data-drop":"0"}));
  }
  // When the bar is crowded, drop the least urgent parts first; the counts row keeps the full roll-up as its title.
  const crumb = el.parentNode.querySelector(".crumb");
  const crowded = () => el.scrollWidth > el.clientWidth + 1 || (crumb && crumb.scrollWidth > crumb.clientWidth + 1);
  const drops = [el.querySelector("[data-drop]")].concat(["idle", "done", "dropped"].map((k) => cs.querySelector('[data-k="' + k + '"]')));
  for (const x of drops){ if (!crowded()) break; if (x) x.remove(); }

  else if (ev === "case" && k === "Enter") enterCase();
  else if (ev === "agents" && (k === "j" || k === "k" || k === "ArrowDown" || k === "ArrowUp")) moveAgent(k === "j" || k === "ArrowDown" ? 1 : -1);
  else if (ev === "agents" && (k === "h" || k === "l" || k === "ArrowLeft" || k === "ArrowRight")){
    const n = paneModel().length;
    if (n){ ui.paneFocus = (ui.paneFocus + (k === "l" || k === "ArrowRight" ? 1 : n - 1)) % n; renderView(); }
  }
  else if (ev === "agents" && k === "z"){ ui.zoom = !ui.zoom; renderView(); }
  else if (ev === "agents" && "bwdi".includes(k) && k.length === 1){
    const f = {b:"blocked", w:"working", d:"done", i:"idle"}[k];
    ui.filter = ui.filter === f ? null : f; ui.paneFocus = 0; renderView();
  }
  else if (ev === "agents" && k === "Enter"){
    const p = paneModel()[ui.paneFocus];
    if (p && p.type === "agent") openAgent(p.step);
  }
  else if (ev === "agent" && (k === "j" || k === "ArrowDown")) moveClaim(1);
  else if (ev === "agent" && (k === "k" || k === "ArrowUp")) moveClaim(-1);
  else if (ev === "agent" && k === "c") copyClaim();
  else if (ev === "evidence" && (k === "j" || k === "ArrowDown")) moveEvent(1);
  else if (ev === "evidence" && (k === "k" || k === "ArrowUp")) moveEvent(-1);
  else if (ev === "evidence" && k === "h"){ ui.evHost = cycle(ui.evHost, Array.from(new Set(idx.events.map((x) => x.host).filter(Boolean)))); renderView(); }
  else if (ev === "evidence" && k === "c"){ ui.evCat = cycle(ui.evCat, Array.from(new Set(idx.events.map((x) => x.category).filter(Boolean)))); renderView(); }
  else done = false;
  if (done) e.preventDefault();
}
function copyClaim(){
  const s = idx.byId.get(route.agent), ho = s && handoff(s), c = ho && (ho.claims || [])[Math.max(0, ui.claimSel)];
  if (!c || !c.claim_id) return;
  const ok = () => flashFoot("copied " + c.claim_id), bad = () => flashFoot("copy failed");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.claim_id).then(ok, bad); else bad();
}

// ---------- palette and key sheet ----------
const sheet = {mode:null, items:[], sel:0, back:null};
function closeSheet(){
  $("scrim").hidden = true; sheet.mode = null; clear($("sheet"));
  if (sheet.back && sheet.back.isConnected) sheet.back.focus();
  sheet.back = null;
}
function openShell(mode){ sheet.back = document.activeElement; sheet.mode = mode; sheet.sel = 0; clear($("sheet")); $("scrim").hidden = false; }
function paletteItems(q){
  const items = [], ql = q.trim().toLowerCase(), hit = (t) => !ql || t.toLowerCase().includes(ql);
  if (sheet.mode === "goto"){
    for (const [v, label] of [["case", "Case"], ["agents", "Agents"], ["evidence", "Evidence"]]) if (hit(label)) items.push({group:"Views", label:label, act:() => go({view:v})});
    for (const w of idx.waveList){
      const c = counts(w.steps), roll = KINDS.filter((k) => c[k]).map((k) => c[k] + " " + k).join(" \u00b7 ");
      const kids = w.steps.filter((s) => hit(s.name + " " + s.step_id + " " + roleOf(s) + " wave " + w.wave));
      if (!kids.length) continue;
      items.push({group:"Waves", label:"Wave " + w.wave, glyph:rollKind(w.steps), meta:roll, act:() => { selectCaseStep(waveRep(w)); go({view:"case"}); }});
      for (const s of kids) items.push({group:"Waves", label:s.name, sub:roleOf(s), glyph:kindOf(s), meta:stateWords(s), title:cause(s) || null, ind:true, act:() => openAgent(s)});
    }
  } else {
    for (const s of state.steps || []) if (hit([s.name, s.step_id, roleOf(s), s.profile, stateWords(s)].join(" "))) items.push({group:"Agents", label:s.name, sub:roleOf(s), glyph:kindOf(s), meta:stateWords(s), title:cause(s) || null, act:() => openAgent(s)});
    if (ql) for (const x of idx.claims){
      const c = x.c;
      if (hit([c.claim_id, c.kind, c.statement, (c.cited_events || []).join(" ")].join(" "))) items.push({group:"Claims", label:c.claim_id || "(no id)", mono:true, sub:c.statement || "", meta:c.kind || "",
        act:() => { if (!x.s) return; const i = ((handoff(x.s) || {}).claims || []).indexOf(c); openAgent(x.s); ui.claimSel = Math.max(0, i); markClaim(); }});
    }
    if (ql) for (const e of idx.events) if (hit([e.id, e.host, e.category, e.summary].join(" "))) items.push({group:"Events", label:e.id, mono:true, sub:e.summary || "", meta:e.host || "",
      act:() => { ui.evHost = null; ui.evCat = null; ui.evSel = e.id; go({view:"evidence"}); }});
  }
  return items.slice(0, 80);
}
function renderPaletteList(){
  const b = $("pal-list"); clear(b);
  let group = null;
  sheet.items.forEach((it, i) => {
    if (it.group !== group){ group = it.group; b.appendChild(h("div", "sheet-grp", group)); }
    const r = add(h("button", "pr" + (it.ind ? " ind" : "") + (i === sheet.sel ? " on" : ""), null, {type:"button", role:"option", "aria-selected":String(i === sheet.sel), "data-i":i}),
      it.glyph ? glyph(it.glyph) : null, h("span", (it.mono ? "mono " : "") + "ell", it.label, {style:"flex:none;max-width:45%"}), it.sub ? h("span", "sm mut ell grow", it.sub) : h("span", "grow"), it.meta ? h("span", "meta", it.meta, {title:it.title}) : null);
    r.addEventListener("click", () => { const a = it.act; closeSheet(); a(); });
    r.addEventListener("mousemove", () => { if (sheet.sel !== i){ sheet.sel = i; b.querySelectorAll(".pr").forEach((x) => x.classList.toggle("on", Number(x.dataset.i) === i)); } });
    b.appendChild(r);
  });
  if (!sheet.items.length) b.appendChild(h("div", "empty", "No match."));
  const on = b.querySelector(".pr.on");
  if (on) on.scrollIntoView({block:"nearest", behavior:"instant"});
}
function openPalette(mode){
  if (!state) return;
  openShell(mode);
  const input = h("input", null, null, {type:"text", placeholder:mode === "goto" ? "Go to a view, wave or agent" : "Search agents, claims and events", "aria-label":mode === "goto" ? "Go to" : "Search", autocomplete:"off", spellcheck:"false"});
  add($("sheet"), add(h("div", "sheet-h"), icon(mode === "goto" ? "chevron-right" : "search"), input, h("span", "kbd", "esc")), h("div", "sheet-b", null, {id:"pal-list", role:"listbox"}));
  const refresh = () => { sheet.items = paletteItems(input.value); sheet.sel = 0; renderPaletteList(); };
  input.addEventListener("input", refresh);
  refresh();
  input.focus();
}
function openKeys(){
  openShell("keys");
  const groups = [["Everywhere", [["1 2 3", "Case, Agents, Evidence"], ["/", "search"], ["Ctrl K", "search"], ["g", "go to"], ["?", "all keys"], ["esc", "close, back, clear filter"]]],
    ["Case", [["j k", "move through waves and steps"], ["enter", "open the step, or expand the wave"]]],
    ["Agents", [["j k", "agent"], ["h l", "pane"], ["enter", "open the focused agent"], ["z", "zoom pane"], ["b w d i", "blocked, working, done, idle only"]]],
    ["Agent", [["j k", "claim"], ["c", "copy claim id"], ["esc", "back to panes"]]],
    ["Evidence", [["j k", "event"], ["h", "filter host"], ["c", "filter category"]]]];
  const body = h("div", "keys");
  for (const [g, rows] of groups){ body.appendChild(h("h3", null, g)); for (const [k, l] of rows) body.appendChild(add(h("div", "kr"), h("span", "kbd", k), l)); }
  add($("sheet"), add(h("div", "sheet-h"), h("span", "b6 grow", "All keys"), h("span", "kbd", "esc")), add(h("div", "sheet-b"), body));
  $("sheet").setAttribute("tabindex", "-1"); $("sheet").focus();
}
function sheetKey(e){
  if (e.key === "Escape"){ e.preventDefault(); closeSheet(); return; }
  if (sheet.mode === "keys"){ if (e.key === "?"){ e.preventDefault(); closeSheet(); } return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || (e.ctrlKey && (e.key === "n" || e.key === "p"))){
    e.preventDefault();
    const n = sheet.items.length; if (!n) return;
    sheet.sel = (sheet.sel + (e.key === "ArrowDown" || e.key === "n" ? 1 : n - 1)) % n;
    renderPaletteList();
  } else if (e.key === "Enter"){
    e.preventDefault();
    const it = sheet.items[sheet.sel];
    closeSheet();
    if (it) it.act();
  }
}

// ---------- toasts ----------
function focusedAgent(){
  const ev = effView();
  if (ev === "agent") return route.agent;
  if (ev === "agents") return ui.agentSel;
  if (ev === "case"){ const sel = caseSelection(); return sel.step ? sel.step.step_id : null; }
  return null;
}
function toast(s){
  const box = $("toasts");
  const t = add(h("button", "toast enter", null, {type:"button", title:"Open " + s.name}), glyph("done"),
    add(h("div", "grow"), h("div", "b5 ell", s.name + " done"), h("div", "sm mut ell", "wave " + s.wave + " \u00b7 " + (typeof s.claims === "number" ? plural(s.claims, "claim") : "no claims parsed"))));
  t.addEventListener("click", () => { t.remove(); openAgent(s); });
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), TOAST_MS);
}
function noticeDone(){
  const now = new Map((state.steps || []).map((s) => [s.step_id, s.state]));
  if (prevStates){
    const focus = focusedAgent();
    for (const s of state.steps || []){
      const before = prevStates.get(s.step_id);
      if (s.state === "done" && before !== undefined && before !== "done" && s.step_id !== focus) toast(s);
    }
  }
  prevStates = now;
}

// ---------- loop ----------
function tick(){
  if (!state) return;
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach((e) => { const t = fmtDur(now - Number(e.dataset.since) + Number(e.dataset.base || 0)); if (e.textContent !== t) e.textContent = t; });
  refreshLiveText();
}
function renderAll(){
  idx = buildIndex();
  renderMark(); renderTabs(); renderTop(); renderPhoneHead(); renderFoot();
  renderView();
}
async function poll(){
  try {
    const res = await fetch(STATE_URL, {cache:"no-store", credentials:"omit"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const next = await res.json();
    if (!next || !Array.isArray(next.steps)) throw new Error("malformed state");
    const hadError = fetchError !== null;
    fetchError = null; state = next;
    // Observation timestamps change every poll; rebuild the view only when the round's content changes.
    const tools = next.tools ? Object.assign({}, next.tools, {lab:null}) : null;
    const key = JSON.stringify(Object.assign({}, next, {temporal:null, tools:tools, live:null}));
    if (key !== lastKey){ lastKey = key; renderAll(); noticeDone(); }
    else { idx = buildIndex(); renderHealth(); if (hadError) renderView(); tick(); }
  } catch (err){
    fetchError = err && err.message ? err.message : "fetch failed";
    if (state){ renderHealth(); tick(); }
    else {
      renderMark();
      const hl = $("health"); clear(hl); const x = stEl("blocked", "Board unreachable", true); x.title = fetchError; hl.appendChild(x);
      const m = $("main"); clear(m); m.appendChild(h("div", "empty", "Waiting for the board server: " + fetchError));
      renderFoot();
    }
  }
  setTimeout(poll, POLL_MS);
}

addEventListener("keydown", onKey);
$("scrim").addEventListener("mousedown", (e) => { if (e.target === $("scrim")) closeSheet(); });
addEventListener("hashchange", () => { readHash(); applyRoute(); });
phoneMq.addEventListener("change", applyRoute);
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state){ renderHealth(); renderView(); } }, 150); });
readHash();
applyRoute();
renderMark();
renderFoot();
setInterval(tick, 1000);
poll();
})();
</script>
