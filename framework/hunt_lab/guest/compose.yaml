version: '2.4'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ingest.geoip.downloader.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    networks:
      backend:
        ipv4_address: 172.30.91.2
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  arkime:
    image: ghcr.io/arkime/arkime/arkime:v6.9.1
    command: /opt/arkime/bin/docker.sh viewer --wait-for-db http://172.30.91.2:9200 -- -n hermes-lab
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 512m
    volumes:
      - ./arkime.ini:/opt/arkime/etc/config.ini:ro
      - arkime-pcap:/opt/arkime/raw
    # "host" is this disposable Linux GUEST, never the Windows workstation.
    network_mode: host
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    environment:
      NODE_OPTIONS: --max-old-space-size=800
    mem_limit: 1280m
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    # As for Arkime, "host" is this disposable Linux GUEST; the backend network is internal.
    network_mode: host
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
volumes:
  elastic-data:
  arkime-pcap:
networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.91.0/24
