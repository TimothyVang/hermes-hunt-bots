[default]
elasticsearch=http://172.30.91.2:9200
prefix=arkime
pcapDir=/opt/arkime/raw
interface=lo
rotateIndex=daily
packetThreads=1
maxFileSizeG=1
freeSpaceG=1
dropUser=root
dropGroup=root
viewHost=0.0.0.0
viewPort=8005
authMode=anonymous
mcpEnabled=false
# Synthetic, single-user guest only. No live capture service is started.
# Elasticsearch has no published port and is only on the internal Docker network.
