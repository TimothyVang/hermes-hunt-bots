# Slack app for operator/slack_gates.py (ADR 0004): Socket Mode, interactivity, no event subscriptions.
# Create the app from this manifest; operator/README.md lists the remaining setup steps.
display_information:
  name: Hunt Gates
  description: The operator's own bridge for the two hunt decisions (scope approval, final report).
  background_color: "#1f2933"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Hunt Gates
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
